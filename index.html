
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kod Kopyalama</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #101827, #202c44);
    font-family: Arial, sans-serif;
}

.container {
    width: 90%;
    max-width: 500px;
    background: #ffffff;
    padding: 35px 25px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

h2 {
    margin-bottom: 25px;
    color: #202c44;
}

.code {
    background: #edf0f5;
    padding: 18px 12px;
    border-radius: 10px;
    font-size: 13px;
    word-break: break-all;
    color: #222;
    margin-bottom: 20px;
    user-select: all;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
}

#message {
    margin-top: 15px;
    color: #16a34a;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
    <h2>Kodunu Kopyala</h2>

    <div class="code" id="myCode">05abd56895228ef01001f3a6bee7c90aaa95dca595acb4f724f1378269fa663a56</div>

    <button onclick="copyCode()">Kopyala</button>

    <p id="message"></p>
</div>

<script>
function copyCode() {
    const code = document.getElementById("myCode").innerText;

    navigator.clipboard.writeText(code).then(() => {
        document.getElementById("message").innerText =
            "✓ Başarıyla kopyalandı!";
    }).catch(() => {
        document.getElementById("message").innerText =
            "Kopyalama başarısız oldu.";
    });
}
</script>

</body>
</html>
